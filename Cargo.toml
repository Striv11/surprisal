[package]
name = "surprisal"
version = "0.1.0"
edition = "2021"
description = "A predictive-coding sequence learner that learns online and shows its surprise"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "surprisal"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1
